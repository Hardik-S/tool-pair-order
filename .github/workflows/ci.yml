name: CI

on:
  push:
  pull_request:

jobs:
  installed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install noneditable package
        run: python -m pip install .
      - name: Verify installed command and distribution
        run: python acceptance.py
      - name: Run full tests without skips
        run: python -m unittest discover -s tests -v
