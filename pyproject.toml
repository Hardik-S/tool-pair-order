[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-pair-order"
version = "0.1.0"
description = "Offline checker for ordering in normalized synthetic tool event pairs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10"]

[project.scripts]
tool-pair-order = "tool_pair_order.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
